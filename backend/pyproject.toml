[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Local-first meeting discussion copilot"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "redis>=5.2",
  "reportlab>=4.2",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.1",
  "numpy>=1.26",
  "nvidia-cublas-cu12>=12.4",
  "nvidia-cudnn-cu12>=9.1",
]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses Depends() defaults.

[tool.ruff.lint.per-file-ignores]
"tests/integration_check.py" = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "numpy", "reportlab.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

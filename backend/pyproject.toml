[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Local-first meeting discussion copilot"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "redis>=5.2",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1", "numpy>=1.26"]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
